<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#f6f8fa"/>
  
  <!-- Computer monitor -->
  <rect x="100" y="80" width="200" height="120" rx="5" fill="#fff" stroke="#e1e4e8" stroke-width="2"/>
  <rect x="110" y="90" width="180" height="100" fill="#0366d6" opacity="0.1"/>
  
  <!-- 404 text on screen -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0366d6" text-anchor="middle">404</text>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">Page Not Found</text>
  
  <!-- Monitor stand -->
  <rect x="190" y="200" width="20" height="30" fill="#e1e4e8"/>
  <rect x="170" y="230" width="60" height="10" rx="2" fill="#e1e4e8"/>
  
  <!-- Question mark -->
  <circle cx="320" cy="120" r="25" fill="#ffd700"/>
  <text x="320" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
  
  <!-- Magnifying glass -->
  <circle cx="80" cy="160" r="15" fill="none" stroke="#6c757d" stroke-width="3"/>
  <line x1="90" y1="170" x2="105" y2="185" stroke="#6c757d" stroke-width="3" stroke-linecap="round"/>
</svg>